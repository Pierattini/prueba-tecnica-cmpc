name: cmpc-books

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmpc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmpc}
      POSTGRES_DB: ${POSTGRES_DB:-cmpc_books}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmpc}:${POSTGRES_PASSWORD:-cmpc}@postgres:5432/${POSTGRES_DB:-cmpc_books}?schema=public
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-cambiar-en-produccion-1234}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
      RUN_SEED: ${RUN_SEED:-true}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
  uploads:
