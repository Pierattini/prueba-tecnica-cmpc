server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # un poco mas que el limite de 2MB de la API para que el error lo devuelva el backend
  client_max_body_size 3m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # sin buffer para que el CSV llegue en streaming
    proxy_buffering off;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    expires 7d;
  }

  # los assets de vite llevan hash en el nombre, se pueden cachear sin limite
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
